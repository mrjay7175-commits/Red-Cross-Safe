{% extends 'Hospital/base.html' %}

{% block content %}

<div class="card shadow">

<div class="card-header bg-warning">

<h3>Update Doctor</h3>

</div>

<div class="card-body">

<form method="POST" enctype="multipart/form-data">

{% csrf_token %}

{{ form.as_p }}

Cancel
</a>

</form>

</div>

</div>

</div>

{% endblock %}
