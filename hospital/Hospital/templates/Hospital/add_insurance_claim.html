{% extends 'Hospital/base.html' %}

{% block content %}
<div class="container mt-4">
    <div class="card shadow">
        <div class="card-header bg-primary text-white"><h3>New Insurance Claim</h3></div>
        <div class="card-body">
            <form method="POST">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label">Patient</label>
                    <select name="patient" class="form-select" required>
                        <option value="">Select Patient</option>
                        {% for p in patients %}
                        <option value="{{ p.id }}">{{ p.name }} ({{ p.patient_id }})</option>
                        {% endfor %}
                    </select>
                </div>

                {{ form.as_p }}

                <button type="submit" class="btn btn-success">Save</button>
                <a href="{% url 'insurance_claim_list' %}" class="btn btn-secondary">Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
