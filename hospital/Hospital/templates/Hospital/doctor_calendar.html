{% extends 'Hospital/base.html' %}

{% block content %}

<div class="container-fluid mt-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Doctor Calendar</h2>

        <select id="doctorFilter" class="form-select" style="max-width:280px;">
            <option value="">All Doctors</option>
            {% for d in doctors %}
            <option value="{{ d.id }}" {% if selected_doctor_id == d.id|stringformat:"s" %}selected{% endif %}>{{ d.name }}</option>
            {% endfor %}
        </select>
    </div>

    <div id="calendar"></div>

</div>

<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>

<script>
    const calendarEl = document.getElementById('calendar');
    const doctorFilter = document.getElementById('doctorFilter');

    const calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',
        headerToolbar: {
            left: 'prev,next today',
            center: 'title',
            right: 'dayGridMonth,timeGridWeek,listWeek'
        },
        events: function(info, successCallback, failureCallback) {
            const doctorId = doctorFilter.value;
            fetch("{% url 'doctor_calendar_events' %}" + (doctorId ? "?doctor=" + doctorId : ""))
                .then(r => r.json())
                .then(successCallback)
                .catch(failureCallback);
        }
    });

    calendar.render();

    doctorFilter.addEventListener('change', function(){
        calendar.refetchEvents();
    });
</script>

{% endblock %}
