{% extends 'Hospital/base.html' %}

{% block content %}

<div class="container mt-4" style="max-width:420px;">

    <div class="d-flex justify-content-between align-items-center mb-3 no-print">
        <h2>Patient Label</h2>
        <div>
            <button onclick="window.print()" class="btn btn-primary">
                <i class="bi bi-printer-fill"></i> Print
            </button>
            <a href="{% url 'patient_detail' patient.id %}" class="btn btn-secondary">Back</a>
        </div>
    </div>

    <div class="card shadow-sm text-center p-3">
        <h5>{{ patient.name }}</h5>
        <p class="mb-1 text-muted">Age {{ patient.age }} - {{ patient.gender }}</p>
        <img src="{% url 'patient_barcode' patient.id %}" alt="barcode" class="img-fluid mt-2">
        <img src="{% url 'patient_qr_code' patient.id %}" alt="qr" width="120" class="mx-auto mt-3">
        <p class="small text-muted mt-2">Scan QR for quick check-in</p>
    </div>

</div>

<style>
@media print {
    .no-print, nav, .sidebar, header, footer { display: none !important; }
}
</style>

{% endblock %}
