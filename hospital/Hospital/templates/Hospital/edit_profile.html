{% extends 'Hospital/base.html' %}

{% block page_title %}
Edit Profile
{% endblock %}

{% block content %}

<div class="container">

    <div class="row justify-content-center">

        <div class="col-lg-7">

            <div class="card shadow-lg">

                <div class="card-header bg-primary text-white">

                    <h4>Edit Profile</h4>

                </div>

                <div class="card-body">

                    <form method="POST">

                        {% csrf_token %}

                        {{ form.as_p }}

                        <button
                            class="btn btn-success">

                            Save Changes

                        </button>

                        <a href="{% url 'settings' %}"
                           class="btn btn-secondary">

                            Cancel

                        </a>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
